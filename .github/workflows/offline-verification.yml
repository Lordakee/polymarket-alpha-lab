name: Offline verification

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.0'
          enable-cache: false
      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.12
      - name: Run sanitized full offline verification
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python scripts/verify_local.py --full 2>&1 | tee "$RUNNER_TEMP/offline-verification.log"
      - name: Check tracked-file cleanliness
        run: |
          git diff --check
          git diff --exit-code
      - name: Publish verification log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-verification-${{ github.sha }}
          path: ${{ runner.temp }}/offline-verification.log
          retention-days: 7
          if-no-files-found: ignore
