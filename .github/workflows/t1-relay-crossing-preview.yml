# PREVIEW (non-binding): T1 relay-crossing fd-survival probe on a
# GitHub-hosted Ubuntu runner. Manual workflow_dispatch ONLY - there are no
# push/pull_request triggers, so this job can NEVER gate a merge or a release.
# The binding T1 qualification remains the dev-server run on the recovered
# Linux host (DELIVERY_PLAN.md S67/S68). Preconditions P1-P4 mirror the L9 T1
# CI feasibility report (GO verdict):
#   P1 manual dispatch only, PREVIEW/non-binding labels on the job and every
#      step;
#   P2 bubblewrap 0.11.1 built from the sha256-pinned official release
#      tarball, installed non-setuid into a writable prefix, with the version
#      asserted in its own step before pytest (the gate file is version-blind;
#      apt on 24.04 ships 0.8/0.9, not 0.11.1);
#   P3 AppArmor unprivileged-userns restriction lifted via sudo sysctl
#      (Ubuntu 24.04 defaults it to 1, which breaks bwrap namespace and
#      loopback setup under --unshare-net);
#   P4 delegated cgroup v2 subtree with memory+pids controllers, owned by the
#      runner user (the supervisor writes the subtree's own subtree_control,
#      memory.max/memory.swap.max/pids.max/cgroup.procs/cgroup.kill).
name: T1 relay-crossing fd-survival PREVIEW (non-binding)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: PREVIEW (non-binding) - T1 relay-crossing fd-survival probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: PREVIEW (non-binding) - check out revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: PREVIEW (non-binding) - install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.0'
          enable-cache: false
      - name: PREVIEW (non-binding) - install locked development environment
        run: uv sync --locked --extra dev --python /usr/bin/python3.12
        # System CPython, not uv's standalone build: the T1 harness measures
        # sys.executable's runtime closure and rebinds the interpreter into
        # the guest at /pal/runtime/bin/python3; the standalone build's
        # private-lib RPATH ($ORIGIN/../lib) then misses libz.so.1 inside the
        # namespace, while the system interpreter's libs live in the standard
        # search dirs the closure binds at their original absolute paths.
        # This also matches the dev server's system-Python production runtime.
      - name: PREVIEW (non-binding) - install bwrap build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config xz-utils
      - name: PREVIEW (non-binding) - build bubblewrap 0.11.1 from the sha256-pinned official tarball
        env:
          BWRAP_URL: https://github.com/containers/bubblewrap/releases/download/v0.11.1/bubblewrap-0.11.1.tar.xz
          BWRAP_SHA256: c1b7455a1283b1295879a46d5f001dfd088c0bb0f238abb5e128b3583a246f71
          BWRAP_PREFIX: ${{ runner.temp }}/pal-t1-bwrap
        run: |
          set -euo pipefail
          # P2: the fd-sweep property under test is 0.11.1 userspace logic, so
          # the SOURCE must be the official 0.11.1 release tarball. The pin is
          # the sha256 published in the upstream release notes; any mismatch
          # fails this step loudly. Man-page generation stays off
          # (-Dman=disabled, the 0.11.1 feature option; there is no "docs"
          # option in this release) to avoid the xsltproc dependency; the
          # meson default priv-mode yields a plain non-setuid binary.
          cd "$RUNNER_TEMP"
          curl -fsSL -o bubblewrap-0.11.1.tar.xz "$BWRAP_URL"
          echo "$BWRAP_SHA256  bubblewrap-0.11.1.tar.xz" | sha256sum -c -
          tar -xJf bubblewrap-0.11.1.tar.xz
          meson setup bwrap-build bubblewrap-0.11.1 --prefix="$BWRAP_PREFIX" -Dman=disabled
          ninja -C bwrap-build
          meson install -C bwrap-build
          test -x "$BWRAP_PREFIX/bin/bwrap"
          echo "$BWRAP_PREFIX/bin" >> "$GITHUB_PATH"
      - name: PREVIEW (non-binding) - assert bwrap 0.11.1 resolves on PATH, non-setuid
        run: |
          set -euo pipefail
          # P2: the gate file pins whatever bwrap it finds (self-measured
          # digest) and never checks the version, so this step must prove the
          # PATH-resolved binary is exactly 0.11.1 (mirroring the WP-02
          # bwrap_identity version check) and carries no setuid/setgid bit
          # (the production _check_no_elevation refuses elevation).
          bwrap_path="$(command -v bwrap)"
          echo "resolved bwrap: $bwrap_path"
          sha256sum "$bwrap_path"
          version="$("$bwrap_path" --version)"
          echo "bwrap --version: $version"
          [ "$version" = "bubblewrap 0.11.1" ]
          if [ -u "$bwrap_path" ] || [ -g "$bwrap_path" ]; then
            echo "REFUSED: resolved bwrap is setuid/setgid; admission would reject it"
            exit 1
          fi
      - name: PREVIEW (non-binding) - lift AppArmor unprivileged userns restriction
        run: |
          set -euo pipefail
          # P3: without this, bwrap cannot create the user namespace or bring
          # up namespace-local loopback under --unshare-net on 24.04.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns
      - name: PREVIEW (non-binding) - delegate cgroup v2 subtree with memory+pids
        run: |
          set -euo pipefail
          # P4: replicate systemd Delegate=yes semantics by hand. The root
          # cgroup is exempt from the no-internal-process rule, so enabling
          # +memory +pids at the root succeeds even with systemd as PID 1;
          # the subtree itself must be fully owned by the runner user because
          # the supervisor writes its cgroup.subtree_control, per-allocation
          # controls and cgroup.kill, and runs with cwd inside it.
          sudo mkdir -p /sys/fs/cgroup/pal-t1
          echo '+memory +pids' | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          sudo chown -R "$(id -un):$(id -gn)" /sys/fs/cgroup/pal-t1
          controllers="$(cat /sys/fs/cgroup/pal-t1/cgroup.controllers)"
          echo "pal-t1 cgroup.controllers: $controllers"
          case " $controllers " in
            *" memory "*) ;;
            *) echo 'memory controller missing from the delegated subtree'; exit 1 ;;
          esac
          case " $controllers " in
            *" pids "*) ;;
            *) echo 'pids controller missing from the delegated subtree'; exit 1 ;;
          esac
          test -w /sys/fs/cgroup/pal-t1/cgroup.subtree_control
      - name: PREVIEW (non-binding) - diagnose the interpreter runtime closure
        run: |
          set -euo pipefail
          # Ground truth for the persistent guest libz.so.1 failure: the T1
          # harness binds the guest /pal/runtime from a measured closure
          # (tests/test_research_process_linux.py discover_runtime_closure).
          # Dump the interpreter's DT_NEEDED chain and re-run that closure
          # probe verbatim to see whether libz enters the traced set at all.
          INTERP="$(readlink -f "$(command -v .venv/bin/python)")"
          echo "interpreter: $INTERP"
          ldd "$INTERP" || true
          for obj in "$INTERP" $(ldd "$INTERP" 2>/dev/null | awk '/=> \//{print $3}'); do
            echo "--- $obj"
            objdump -p "$obj" 2>/dev/null | grep -E 'NEEDED|RPATH|RUNPATH' || true
          done
          echo '--- closure probe output (verbatim from discover_runtime_closure)'
          "$INTERP" -S -B -c 'import hashlib,json,os,select,signal,sys,time
          files={m.__file__ for m in sys.modules.values() if getattr(m,"__file__",None)}
          mapped=set()
          for line in open("/proc/self/maps"):
              path=line.rstrip().rsplit(" ",1)[-1]
              if path.startswith("/") and ".so" in path: mapped.add(path)
          print(json.dumps(sorted(files|mapped)))'
          echo '--- libz presence in probe output:'
          "$INTERP" -S -B -c 'import hashlib,json,os,select,signal,sys,time
          files={m.__file__ for m in sys.modules.values() if getattr(m,"__file__",None)}
          mapped=set()
          for line in open("/proc/self/maps"):
              path=line.rstrip().rsplit(" ",1)[-1]
              if path.startswith("/") and ".so" in path: mapped.add(path)
          hits=[p for p in sorted(files|mapped) if "libz" in p]
          print("libz entries:", hits)'
      - name: PREVIEW (non-binding) - replicate the cgroup admit sequence
        run: |
          set +e
          # Run-7 finding: pal-t1's subtree_control is EMPTY at job start (the
          # setup step enables controllers at the global root only), so a
          # fresh child cannot enable them; the supervisor's own sequence must
          # first enable at pal-t1 (production _enable_root_controls), then
          # create the allocation, write limits, then admit. Mirror that order
          # with full per-operation capture (no -e so every line runs).
          R=/sys/fs/cgroup/pal-t1
          echo "start: root subtree_control='$(cat $R/cgroup.subtree_control)'"
          echo '+memory +pids' > "$R/cgroup.subtree_control" 2>/tmp/r0
          echo "1 enable(+memory +pids at pal-t1): $? err='$(cat /tmp/r0)'"
          echo "after: root subtree_control='$(cat $R/cgroup.subtree_control)'"
          A=$R/pal-call-diag-a
          rm -rf "$A"; mkdir "$A"
          echo "2 mkdir allocation: $?"
          echo 536870912 > "$A/memory.max" 2>/tmp/a1
          echo "3 memory.max: $? err='$(cat /tmp/a1)'"
          echo 0 > "$A/memory.swap.max" 2>/tmp/a1b
          echo "4 memory.swap.max: $? err='$(cat /tmp/a1b)'"
          echo 32 > "$A/pids.max" 2>/tmp/a1c
          echo "5 pids.max: $? err='$(cat /tmp/a1c)'"
          echo $$ > "$A/cgroup.procs" 2>/tmp/a2
          echo "6 admit-SELF, no subtree_control on allocation: $? err='$(cat /tmp/a2)'"
          echo '+memory +pids' > "$A/cgroup.subtree_control" 2>/tmp/a3
          echo "7 enable(+memory +pids ON allocation): $? err='$(cat /tmp/a3)'"
          echo $$ > "$A/cgroup.procs" 2>/tmp/a4
          echo "8 admit-SELF after enabling on allocation: $? err='$(cat /tmp/a4)'"
          B=$R/pal-call-diag-b
          rm -rf "$B"; mkdir "$B"
          .venv/bin/python -c 'import time; time.sleep(30)' & CPID=$!
          sleep 0.5
          echo "$CPID" > "$B/cgroup.procs" 2>/tmp/b1
          echo "9 admit-CHILD, no subtree_control: $? err='$(cat /tmp/b1)'"
          echo "10 allocation-A procs: '$(cat $A/cgroup.procs 2>/dev/null)'"
          echo "11 allocation-B procs: '$(cat $B/cgroup.procs 2>/dev/null)'"
          kill "$CPID" 2>/dev/null
          rmdir "$A" "$B" 2>/dev/null
          echo "12 cleanup: $? (rmdir fails if procs remain - that is evidence)"
          echo done
      - name: PREVIEW (non-binding) - drain the supervisor stderr from one session
        timeout-minutes: 5
        env:
          POLYMARKET_ALPHA_LAB_RUN_LINUX_RELAY_CROSSING: '1'
          POLYMARKET_ALPHA_LAB_LINUX_CGROUP_ROOT: /sys/fs/cgroup/pal-t1
        run: |
          set -euo pipefail
          # Run-5 evidence: the CLOEXEC control path works, but the full
          # supervisor drive dies with the report channel at EOF and no bytes;
          # the harness captures the supervisor's stderr into _stderr_r and
          # never shows it. Drive one real _CrossingSession, catch the report
          # assertion, then drain stderr/stdout and print the exit code.
          .venv/bin/python - << 'DRIVER'
          import fcntl, json, os, select, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, '.')
          from tests.test_research_linux_relay_helper_gates import (
              _open_channel, _CrossingSession, require_crossing_probe)
          from polymarket_alpha_lab import research_linux_relay as relay
          requirements = require_crossing_probe()
          with tempfile.TemporaryDirectory() as workdir:
              port = relay.draw_relay_port()
              parent_end, child_fd = _open_channel()
              session = _CrossingSession(requirements, Path(workdir), parent_end,
                                         child_fd, port)
              try:
                  session.run_version()
                  print('DRIVER: run_version completed')
              except AssertionError as failure:
                  print('DRIVER: run_version assertion:', failure)
              for name in ('_stderr_r', '_stdout_r'):
                  descriptor = getattr(session, name)
                  fcntl.fcntl(descriptor, fcntl.F_SETFL, os.O_NONBLOCK)
                  drained = b''
                  while True:
                      ready, _, _ = select.select([descriptor], [], [], 0.3)
                      if not ready:
                          break
                      block = os.read(descriptor, 65536)
                      if not block:
                          break
                      drained += block
                  print('DRIVER: %s (%d bytes):' % (name, len(drained)))
                  print(drained.decode('utf-8', 'replace')[-4000:] or '(empty)')
              print('DRIVER: supervisor returncode:', session._supervisor.poll())
          DRIVER
      - name: PREVIEW (non-binding) - run the relay gate file with the crossing opt-in
        shell: bash
        env:
          POLYMARKET_ALPHA_LAB_RUN_LINUX_RELAY_CROSSING: '1'
          POLYMARKET_ALPHA_LAB_LINUX_CGROUP_ROOT: /sys/fs/cgroup/pal-t1
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          # Sanitized env discipline (scripts/verify_local.py
          # build_environment): no PYTEST_ADDOPTS/PYTEST_PLUGINS/PYTHONPATH/
          # PYTHONHOME inheritance; the two POLYMARKET_ALPHA_LAB_* opt-ins
          # come from the step env above. -v so the three native T1 tests are
          # individually visible.
          unset PYTEST_ADDOPTS PYTEST_PLUGINS PYTHONPATH PYTHONHOME
          .venv/bin/python -m pytest -v -ra tests/test_research_linux_relay_helper_gates.py 2>&1 | tee "$RUNNER_TEMP/t1-relay-crossing-preview.log"
      - name: PREVIEW (non-binding) - check tracked files unchanged
        if: always()
        run: |
          git diff --check
          git diff --exit-code
      - name: PREVIEW (non-binding) - publish preview log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t1-relay-crossing-preview-${{ github.sha }}
          path: ${{ runner.temp }}/t1-relay-crossing-preview.log
          retention-days: 7
          if-no-files-found: ignore
      - name: PREVIEW (non-binding) - print non-binding disclaimer
        if: always()
        run: |
          echo '================================================================================'
          echo 'T1 relay-crossing fd-survival probe - GitHub Actions PREVIEW (NON-BINDING)'
          echo ''
          echo '- This manual preview run NEVER gates a merge or a release.'
          echo '- The binding T1 qualification runs on the recovered Linux dev server'
          echo '  (DELIVERY_PLAN.md S67/S68); that dev-server run stays authoritative.'
          echo '- A FAILURE here is environment diagnostics only, not probe evidence'
          echo '  against the node.'
          echo '- A PASS here is early de-risking only, not a qualification.'
          echo '================================================================================'
