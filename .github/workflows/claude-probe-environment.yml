name: Offline Claude probe environment
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/claude_probe_environment.py'
      - 'scripts/inspect_claude_probe_host.ps1'
      - 'tests/test_claude_probe_environment*.py'
      - 'docs/handoffs/2026-09-20-probe-preparation.md'
      - '.github/workflows/claude-probe-environment.yml'
permissions:
  contents: read
jobs:
  build-environment:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.0'
          enable-cache: false
      - name: Install CI-owned locked build environment (not the user's tools)
        shell: pwsh
        run: |
          uv sync --locked --extra dev --python 3.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test preparation and real PowerShell synthetic host queries
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -q tests/test_claude_probe_environment.py tests/test_claude_probe_environment_workflow.py --junitxml="$env:RUNNER_TEMP/preparation-tests.xml" 2>&1 | Tee-Object "$env:RUNNER_TEMP/preparation-tests.log"
          exit $LASTEXITCODE
      - name: Build offline runtime without a vendor image
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B scripts/claude_probe_environment.py build --source . --output "$env:RUNNER_TEMP/probe-environment-build" --allow-ci-build 2>&1 | Tee-Object "$env:RUNNER_TEMP/environment-build.log"
          exit $LASTEXITCODE
      - name: Preserve exact tracked source
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: probe-environment-build-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/preparation-tests.xml
            ${{ runner.temp }}/preparation-tests.log
            ${{ runner.temp }}/environment-build.log
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: probe-environment-package-${{ github.sha }}
          path: |
            ${{ runner.temp }}/probe-environment-build/claude-probe-environment.zip
            ${{ runner.temp }}/probe-environment-build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7


  relocate-environment:
    name: windows-relocated-${{ matrix.copy }}
    needs: [build-environment]
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2]
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: probe-environment-package-${{ github.sha }}
          path: ${{ runner.temp }}/probe-package
      - name: Verify exact built archive and relocate without vendor or VM execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Build = Join-Path $env:RUNNER_TEMP 'probe-package'
          $Zip = Join-Path $Build 'claude-probe-environment.zip'
          $Line = (Get-Content -LiteralPath (Join-Path $Build 'SHA256SUMS') -Raw).Trim()
          if ($Line -cnotmatch '^([0-9a-f]{64})  claude-probe-environment[.]zip$') { throw 'checksum record invalid' }
          $Hash = $Matches[1]
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $Zip).Hash.ToLowerInvariant() -cne $Hash) { throw 'archive hash mismatch' }
          $Stage = Join-Path $env:RUNNER_TEMP 'probe-environment-relocated-${{ matrix.copy }}'
          # Runner's own Python invokes only stdlib staging. The relocated image
          # below is the CI-built Python3.12 runtime, not this preparation tool.
          python -I -S -B scripts/claude_probe_environment.py stage --archive $Zip --sha256 $Hash --destination $Stage 2>&1 | Tee-Object "$env:RUNNER_TEMP/relocation-stage.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Root = Join-Path $Stage 'input'
          $Receipt = Join-Path $Stage 'output/environment.json'
          & (Join-Path $Root 'python/python.exe') -I -S -B (Join-Path $Root 'probe-environment.py') selftest --root $Root --receipt $Receipt 2>&1 | Tee-Object "$env:RUNNER_TEMP/relocation-smoke.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Observed = Get-Content -LiteralPath $Receipt -Raw | ConvertFrom-Json
          if ($Observed.status -cne 'preparation_smoke_passed' -or $Observed.source_commit -cne '${{ github.sha }}' -or $Observed.official_cases_run -ne 0 -or $Observed.official_cli_executed -ne $false -or $Observed.activation_authorized -ne $false) { throw 'unexpected relocation receipt' }
          Copy-Item -LiteralPath $Receipt -Destination "$env:RUNNER_TEMP/relocated-proof.json"
      - name: Preserve exact tracked source
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: probe-environment-relocated-${{ matrix.copy }}-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/relocation-stage.log
            ${{ runner.temp }}/relocation-smoke.log
            ${{ runner.temp }}/relocated-proof.json
          if-no-files-found: error
          retention-days: 7

  # Keep the original required-check identity. A built ZIP alone is not accepted.
  windows-environment:
    if: ${{ always() }}
    needs: [build-environment, relocate-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require build and both independently relocated runtimes
        env:
          BUILD_RESULT: ${{ needs.build-environment.result }}
          RELOCATED_RESULT: ${{ needs.relocate-environment.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          test "$RELOCATED_RESULT" = success
