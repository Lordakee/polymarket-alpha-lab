name: Handoff first invocation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/download_handoff.ps1'
      - 'tests/test_handoff_download.py'
      - 'tests/handoff_process_probe.py'
      - 'tests/test_handoff_process_probe*.py'
      - 'docs/handoff-first-run.md'
      - '.github/workflows/handoff-first-run.yml'
permissions:
  contents: read
concurrency:
  group: handoff-first-invocation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-invocation:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.0'
          enable-cache: false
      - name: Install locked test environment
        shell: pwsh
        run: uv sync --locked --extra dev --extra postgres --python 3.12
      - name: First test-controlled PS5 invocation, then offline probe contracts
        shell: pwsh
        run: |
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
          $env:PYTHONUTF8 = '1'
          $env:PAL_REQUIRE_HANDOFF_SHELLS = '1'
          .\.venv\Scripts\python.exe -u -m pytest -q -s -o junit_family=legacy 'tests/test_handoff_download.py::test_real_powershell_download_publication[success-powershell.exe]' tests/test_handoff_process_probe.py tests/test_handoff_process_probe_review.py tests/test_handoff_process_probe_windows.py --junitxml="$env:RUNNER_TEMP/handoff-first.xml" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/handoff-first.log"
          exit $LASTEXITCODE
      - name: Check tracked source unchanged
        shell: pwsh
        run: |
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: handoff-first-${{ matrix.trial }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/handoff-first.log
            ${{ runner.temp }}/handoff-first.xml
          retention-days: 7
          if-no-files-found: error
